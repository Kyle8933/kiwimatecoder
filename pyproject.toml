[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwimatecoder"
version = "0.1.0"
description = "AI-powered coding assistant CLI. Bring your own API key."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "prompt_toolkit>=3.0.52",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "click>=8.0",
]

[project.scripts]
kiwimatecoder = "kiwimatecoder.main:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
include = ["kiwimatecoder", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.basedpyright]
include = ["kiwimatecoder"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeArgument = true
reportImportCycles = true
reportExplicitAny = false
reportUnusedCallResult = false
reportImplicitStringConcatenation = false

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pin the rule set explicitly: ruff's own "default" selection has grown
# over releases, and an unpinned `pip install ruff` in CI silently starts
# enforcing new rule families across the whole repo. E4/E7/E9/F is the
# baseline the codebase is actually clean against.
select = ["E4", "E7", "E9", "F"]
